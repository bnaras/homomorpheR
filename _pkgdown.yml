template:
  bootstrap: 5

authors:

  Balasubramanian Narasimhan:
    href: https://naras.su.domains

# Articles are grouped by what the reader is trying to do, not by the
# encryption scheme underneath. Each vignette names its scheme in its
# opening paragraph, which is where that detail belongs; a reader
# choosing an article is choosing a statistical problem.
#
# Labels here must match each vignette's `title:` and its
# \VignetteIndexEntry{} exactly. All three drifted apart before
# 2026-09-06 (three different strings for the Cox vignette alone), so
# treat them as one value stored in three places until pkgdown can be
# told to read the titles directly.
articles:
- title: Start here
  contents:
  - introduction
  - precision

- title: Queries and aggregation
  contents:
  - privacy-preserving-aggregation
  - query-count-threshold

- title: Fitting models across sites
  contents:
  - mle
  - cox
  - cox-threshold
  - cvxr-consensus-admm
  - cvxr-cox-lasso-dlbcl

- title: Prediction and retrieval
  contents:
  - secure-inference
  - encrypted-regression
  - similarity

- title: Adding differential privacy
  contents:
  - cox-threshold-dp
  - cvxr-consensus-admm-dp

